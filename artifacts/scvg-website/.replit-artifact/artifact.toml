kind = "web"
previewPath = "/"
title = "Sun Country Virtual Group"
version = "1.0.0"
id = "artifacts/scvg-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21051

[services.development]
run = "pnpm --filter @workspace/scvg-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scvg-website", "run", "build" ]
publicDir = "artifacts/scvg-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21051"
BASE_PATH = "/"
